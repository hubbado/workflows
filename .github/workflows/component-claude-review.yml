# Reviews a PR as inline comments: one review prompt for the first review and for each follow-up that
# "@claude review" asks for, plus /security-review on the same changes. A script resolves fixed findings.
name: "Component workflow: Claude Review"

on:
  workflow_call:
    inputs:
      context_hint:
        description: "Optional repo-specific guidance for the reviews, such as where authorization lives"
        required: false
        type: string
        default: ""
      allowed_bots:
        description: "Comma-separated bot logins (without the [bot] suffix) permitted to trigger the review, or * for all. Set to an empty string to block all bots."
        required: false
        type: string
        default: "hubbado-automation"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  CLAUDE_FINDINGS_QUERY: |
    query($owner: String!, $name: String!, $pr: Int!) {
      repository(owner: $owner, name: $name) {
        pullRequest(number: $pr) {
          reviewThreads(first: 100) {
            nodes {
              id
              isResolved
              path
              line
              comments(first: 1) { nodes { author { login } body url } }
            }
          }
        }
      }
    }
  CLAUDE_FINDINGS_JQ: >-
    [.data.repository.pullRequest.reviewThreads.nodes[]
    | select(.comments.nodes[0].author.login // "" | test("^claude(\\[bot\\])?$"))
    | {thread_id: .id, resolved: .isResolved, path, line, finding: .comments.nodes[0].body, url: .comments.nodes[0].url}]
  # Heads each comment the review job posts, so its comments can be counted apart from the security review's.
  # A visible heading, because the inline-comment tool strips HTML comments.
  REVIEW_COMMENT_HEADING: "**Code review**"

jobs:
  review-state:
    runs-on: ubuntu-latest
    permissions:
      # read: the compare that finds changed files reads commits
      contents: read
      # write: reacting to a comment on a PR needs it, even with issues: write
      pull-requests: write
      issues: write
      # write: the check run on the PR head, where the checks tab looks
      checks: write
    outputs:
      mode: ${{ steps.state.outputs.mode }}
      pr_number: ${{ steps.state.outputs.pr_number }}
      head_sha: ${{ steps.state.outputs.head_sha }}
      reviewed_sha: ${{ steps.state.outputs.reviewed_sha }}
      guidance: ${{ steps.state.outputs.guidance }}
      has_changes: ${{ steps.collect.outputs.has_changes }}
      check_run_id: ${{ steps.check.outputs.check_run_id }}

    steps:
      - name: Decide between a first review, a follow-up, or nothing
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ -n "$COMMENT_ID" ]; then
            # author_association hides private org membership on public repos, so ask for the permission itself
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission || echo none)
            if [ "$permission" != "admin" ] && [ "$permission" != "write" ]; then
              echo "$COMMENTER has $permission access; a review needs write access"
              exit 0
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null \
              || echo "Could not react to the comment; the review goes on"

            # Everything after "@claude review" is guidance for this review
            guidance=$(printf '%s' "${COMMENT_BODY:14}" | sed -e '1s/^[[:space:][:punct:]]*//')
            delimiter="EOF_$(openssl rand -hex 8)"
            { echo "guidance<<$delimiter"; printf '%s\n' "$guidance"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          fi

          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          reviewed_sha=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | capture("<!-- claude-review reviewed=(?<sha>[0-9a-f]{40}) -->").sha' \
            | tail -n 1)
          echo "reviewed_sha=$reviewed_sha" >> "$GITHUB_OUTPUT"

          # New commits can still change nothing, for example an empty commit or a rebase; a failed compare,
          # such as after a force push, counts as a change, so the follow-up reviews the whole PR again
          changed_files=unknown
          if [ -n "$reviewed_sha" ]; then
            changed_files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$reviewed_sha...$head_sha" --jq '.files | length' 2> /dev/null) \
              || changed_files=unknown
            echo "Files changed since the last review ($reviewed_sha): $changed_files"
          fi

          if [ -z "$reviewed_sha" ]; then
            echo "mode=first" >> "$GITHUB_OUTPUT"
          elif [ "$changed_files" = 0 ]; then
            if [ -n "$COMMENT_ID" ]; then
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "No changes since the last Claude review (${reviewed_sha:0:7}), so there is nothing new to review."
            fi
          else
            echo "mode=follow-up" >> "$GITHUB_OUTPUT"
          fi

      # Collected once, so the code review and the security review cover the same commits
      - name: Collect the findings already on the PR, and the changes to review
        id: collect
        if: steps.state.outputs.mode != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.state.outputs.mode }}
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          HEAD_SHA: ${{ steps.state.outputs.head_sha }}
          REVIEWED_SHA: ${{ steps.state.outputs.reviewed_sha }}
        run: |
          mkdir -p claude-review-inputs
          gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
            -f query="$CLAUDE_FINDINGS_QUERY" --jq "$CLAUDE_FINDINGS_JQ" > claude-review-inputs/findings.json

          # A first review covers the whole PR; a follow-up covers the commits since the last review,
          # or the whole PR again when that commit is gone, for example after a force push
          if [ "$MODE" = first ] || ! gh api -H "Accept: application/vnd.github.diff" \
            "repos/$GITHUB_REPOSITORY/compare/$REVIEWED_SHA...$HEAD_SHA" > claude-review-inputs/changes.diff; then
            gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > claude-review-inputs/changes.diff
          fi

          if [ -s claude-review-inputs/changes.diff ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Not a hidden directory: upload-artifact leaves hidden files out
      - name: Keep the findings and the changes for the review jobs
        if: steps.collect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-inputs
          path: claude-review-inputs/
          retention-days: 1

      # A run started by a comment hangs off the default branch's commit, so GitHub lists it
      # nowhere near the PR; a check run opened on the PR head is what the checks tab shows
      - name: Open a check run on the PR head
        id: check
        if: steps.collect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.state.outputs.head_sha }}
          MODE: ${{ steps.state.outputs.mode }}
        run: |
          check_run_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Claude Review" -f head_sha="$HEAD_SHA" -f status=in_progress \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "output[title]=$MODE review of ${HEAD_SHA:0:7} in progress" \
            -f "output[summary]=The findings are posted as inline comments on the PR." \
            --jq .id)
          echo "check_run_id=$check_run_id" >> "$GITHUB_OUTPUT"

  review:
    needs: review-state
    if: needs.review-state.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      conclusion: ${{ steps.claude.outputs.conclusion }}
      result: ${{ steps.claude.outputs.structured_output }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.review-state.outputs.pr_number }}
      MARKED_COMMENTS_JQ: '[.[] | select(.user.login == "claude[bot]" and (.body | contains(env.REVIEW_COMMENT_HEADING)))] | length'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.review-state.outputs.head_sha }}
          fetch-depth: 1

      - name: Get the findings and the changes to review
        uses: actions/download-artifact@v8
        with:
          name: claude-review-inputs
          path: .claude-review

      - name: Count the code review comments already on the PR
        id: count
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate --jq "$MARKED_COMMENTS_JQ" | awk '{ sum += $1 } END { print sum + 0 }')
          echo "marked_before=$count" >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.review-state.outputs.pr_number }}

            ${{ needs.review-state.outputs.mode == 'first' && 'This is the first review of this pull request.' || 'You reviewed this pull request before, and new commits have arrived since.' }}

            `.claude-review/findings.json` lists the findings already on the pull request:
            each has a thread_id, whether it is resolved, the file and line, and its text.
            `.claude-review/changes.diff` is the diff to review: the whole pull request on a
            first review, or the commits since the last review on a follow-up.

            Do two things:

            1. For each finding that is not resolved, read the current code and decide
               whether the changes fix it. Report a finding as fixed only when the
               problem is gone, not when nearby code merely changed.

            2. Review every change in the diff for new issues, however small the change:
               bugs that will produce wrong results. A separate security review runs alongside
               this review, so leave security vulnerabilities to it.
               Use the CLAUDE.md files for conventions. Flag
               only issues you are certain of. Do not flag style, nitpicks, or anything a
               linter catches. Do not flag an issue that any finding in findings.json
               already covers, resolved or not.

               Post each new issue as an inline comment on the line where it occurs,
               using `mcp__github_inline_comment__create_inline_comment` with
               `confirmed: true`, on the line number in the current file, not a position in
               the diff: read the file to check it. Start each comment with this line, exactly as written:
               ${{ env.REVIEW_COMMENT_HEADING }}
               Then give a brief description and a concrete fix.

            ${{ inputs.context_hint }}

            ${{ needs.review-state.outputs.guidance && format('Guidance from the person who asked for this review: {0}', needs.review-state.outputs.guidance) || '' }}

            Post no other comments. Return the thread_id of each fixed finding with a
            one-sentence reason, and the number of new issues you posted.

          claude_args: >-
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"fixed":{"type":"array","items":{"type":"object","properties":{"thread_id":{"type":"string"},"reason":{"type":"string"}},"required":["thread_id","reason"]}},"posted":{"type":"integer","minimum":0}},"required":["fixed","posted"]}'

      # A review that says it posted findings which never appeared would otherwise look like a clean PR
      - name: Check that the posted findings reached the PR
        if: steps.claude.outputs.structured_output != ''
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          MARKED_BEFORE: ${{ steps.count.outputs.marked_before }}
        run: |
          posted=$(jq -r '.posted' <<< "$RESULT")
          after=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate --jq "$MARKED_COMMENTS_JQ" | awk '{ sum += $1 } END { print sum + 0 }')
          echo "The review reports $posted new finding(s); $((after - MARKED_BEFORE)) appeared on the PR"
          if [ $((after - MARKED_BEFORE)) -lt "$posted" ]; then
            echo "::error::The review reports $posted new finding(s), but only $((after - MARKED_BEFORE)) reached the PR"
            exit 1
          fi

      # The action logs only a count of blocked calls and hides the review's text
      - name: Report blocked calls and the review's text
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # The printed text comes from the model, which reads the PR, so workflow commands in it are switched off
          stop_token=$(openssl rand -hex 16)
          echo "::stop-commands::$stop_token"
          echo "Blocked tool calls:"
          jq -rs 'flatten | [.[] | select(.type? == "result") | .permission_denials[]?]
            | if length == 0 then "(none)" else .[] | "- \(.tool_name): \((.tool_input.command? // (.tool_input | tostring)) | .[0:300])" end' "$EXECUTION_FILE"
          echo "Review result:"
          jq -rs 'flatten | [.[] | select(.type? == "result") | .result? // empty] | last // "(none)" | .[0:3000]' "$EXECUTION_FILE"
          echo "::$stop_token::"

  security-review:
    needs: review-state
    if: needs.review-state.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      conclusion: ${{ steps.claude.outputs.conclusion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.review-state.outputs.head_sha }}
          fetch-depth: 1

      - name: Get the findings and the changes to review
        uses: actions/download-artifact@v8
        with:
          name: claude-review-inputs
          path: .claude-review

      - name: Run Claude Security Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.review-state.outputs.pr_number }}

            ${{ needs.review-state.outputs.mode == 'first' && 'This is the first review of this pull request.' || 'You reviewed this pull request before, and new commits have arrived since.' }}

            Run the `/security-review` skill on the changes in `.claude-review/changes.diff`:
            the whole pull request on a first review, or the commits since the last review
            on a follow-up. Review only those changes. Read surrounding code where needed
            to understand data flow, trust boundaries, and authorization. Use the
            repository's CLAUDE.md for conventions.

            `.claude-review/findings.json` lists the findings already on the pull request,
            resolved or not. Do not post a vulnerability that a finding there already covers.

            ${{ inputs.context_hint }}

            ${{ needs.review-state.outputs.guidance && format('Guidance from the person who asked for this review: {0}', needs.review-state.outputs.guidance) || '' }}

            Post each security vulnerability as an inline comment on the line where it
            occurs, using `mcp__github_inline_comment__create_inline_comment` with
            `confirmed: true`. In each comment give the severity, the vulnerability, and a
            concrete fix. Post nothing else: no summary, no confirmation when you find
            nothing, and no notes on issues that are not security vulnerabilities.

          claude_args: '--allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"'

  finish:
    needs: [review-state, review, security-review]
    # The action skips itself, and reports success, on a PR that changes the calling workflow;
    # only a review that really ran may resolve findings or move the reviewed commit
    if: ${{ !cancelled() && needs.review.outputs.conclusion == 'success' && needs.review.result == 'success' && needs.security-review.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      # contents: write because resolveReviewThread needs it; this job runs only this script, never the model
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.review-state.outputs.pr_number }}
      HEAD_SHA: ${{ needs.review-state.outputs.head_sha }}
      RESULT: ${{ needs.review.outputs.result }}
      RESOLVE_FINDING_MUTATION: |
        mutation($id: ID!, $body: String!) {
          addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $id, body: $body}) { comment { id } }
          resolveReviewThread(input: {threadId: $id}) { thread { isResolved } }
        }

    steps:
      - name: Reply to and resolve each fixed finding
        run: |
          open_ids=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
            -f query="$CLAUDE_FINDINGS_QUERY" --jq "$CLAUDE_FINDINGS_JQ" \
            | jq -r '.[] | select(.resolved | not) | .thread_id')
          jq -c '.fixed[]' <<< "$RESULT" | while read -r fix; do
            thread_id=$(jq -r '.thread_id' <<< "$fix")
            # Resolve only Claude's own open threads, whatever IDs the model returns
            grep -qxF "$thread_id" <<< "$open_ids" || continue
            gh api graphql -f id="$thread_id" -f body="Fixed in ${HEAD_SHA:0:7}: $(jq -r '.reason' <<< "$fix")" \
              -f query="$RESOLVE_FINDING_MUTATION" > /dev/null
          done

      - name: Post the summary below the request it answers, and delete the earlier one
        run: |
          open_findings=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
            -f query="$CLAUDE_FINDINGS_QUERY" --jq "$CLAUDE_FINDINGS_JQ" \
            | jq -r '.[] | select(.resolved | not) | "- [\(.path)](\(.url))"')

          body="<!-- claude-review reviewed=$HEAD_SHA -->
          **Claude review** of $HEAD_SHA

          Open findings: $(grep -c . <<< "$open_findings" || true)
          $open_findings

          To dismiss a finding, resolve its thread. A reply alone does not dismiss it.
          To review the commits pushed after this, comment \`@claude review\`, optionally followed by what to focus on."

          earlier_summaries=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review reviewed="))) | .id')

          # GitHub orders comments by creation, so an edited summary would stay above the request it answers
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

          # Deleted only after the new one is posted, so the recorded commit is never missing
          for comment_id in $earlier_summaries; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" > /dev/null
          done

  report:
    needs: [review-state, review, security-review, finish]
    # After finish, so the count of open findings excludes the ones finish resolved
    if: ${{ always() && needs.review-state.outputs.check_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.review-state.outputs.pr_number }}
      HEAD_SHA: ${{ needs.review-state.outputs.head_sha }}
      CHECK_RUN_ID: ${{ needs.review-state.outputs.check_run_id }}
      REVIEW_RESULT: ${{ needs.review.result }}
      SECURITY_RESULT: ${{ needs.security-review.result }}

    steps:
      - name: Complete the check run with the outcome
        run: |
          if [ "$REVIEW_RESULT" = success ] && [ "$SECURITY_RESULT" != failure ]; then
            open_findings=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
              -f query="$CLAUDE_FINDINGS_QUERY" --jq "$CLAUDE_FINDINGS_JQ" | jq '[.[] | select(.resolved | not)] | length')
            if [ "$open_findings" = 0 ]; then
              conclusion=success
              title="Review of ${HEAD_SHA:0:7}: no open findings"
            else
              conclusion=neutral
              title="Review of ${HEAD_SHA:0:7}: $open_findings open finding(s)"
            fi
            summary="Open findings are inline comments on the PR. Resolve a thread to dismiss its finding; comment \`@claude review\` to review later commits."
          elif [ "$REVIEW_RESULT" = cancelled ] || [ "$SECURITY_RESULT" = cancelled ]; then
            conclusion=cancelled
            title="Review of ${HEAD_SHA:0:7} cancelled"
            summary="A newer review request cancelled this one."
          else
            conclusion=failure
            title="Review of ${HEAD_SHA:0:7} did not complete"
            summary="The review job failed; its log has the reason. Comment \`@claude review\` to run it again."
          fi

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" -f "output[summary]=$summary" --silent
